<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#191816" />
    <meta name="application-name" content="Prospero Dungeon" />
    <meta name="description" content="A private companion with a life of its own, running on your computer." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dungeon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Prospero Dungeon</title>
    <!-- Shown only if the app never starts, as on a browser too old for it; the app replaces it. -->
    <style>
      .boot { opacity: 0; animation: boot-show 0s 6s forwards; margin: 0; padding: 32px 20px; font: 16px/1.5 system-ui, sans-serif; color: #e9e4dc; background: #191816; min-height: 100vh; box-sizing: border-box; }
      @keyframes boot-show { to { opacity: 1; } }
    </style>
    <!-- The last colors and this device's look, before the first paint (settings/useAppColors.ts, deviceLook.ts). -->
    <script>
      try {
        var root = document.documentElement, colors = JSON.parse(localStorage.getItem('companion-colors') || 'null')
        var look = JSON.parse(localStorage.getItem('companion-device-look') || 'null')
        if (!colors) colors = { scheme: matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'ink', styles: {} }
        if (colors.system) colors = matchMedia('(prefers-color-scheme: light)').matches ? { scheme: 'paper', styles: {} } : { scheme: 'ink', styles: {} }
        root.dataset.theme = colors.scheme
        for (var name in colors.styles || {}) root.style.setProperty(name, colors.styles[name])
        if (colors.bar || colors.scheme === 'paper') document.querySelector('meta[name="theme-color"]').setAttribute('content', colors.bar || '#f4f0e8')
        if (look && look.textScale >= 85 && look.textScale <= 200 && look.textScale !== 100) root.style.fontSize = look.textScale + '%'
        if (look && look.font) root.dataset.font = look.font
        if (look && look.motion) root.dataset.motion = look.motion
        if (look && look.textScale >= 150) root.dataset.textLarge = 'true'
        if (look && look.fontEverywhere && look.font !== 'default') root.dataset.fontEverywhere = 'true'
      } catch (error) { /* Ink until the app loads. */ }
    </script>
  </head>
  <body>
    <div id="root"><p class="boot">The Dungeon has not started in this browser. Reload the page. If it still does not open, update this browser or try another one.</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
